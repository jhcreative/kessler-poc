# Local and box. Only Caddy (web) publishes a port, on loopback; on the box, the edge Caddy fronts it (POC-11).
name: ofs
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ofs
      POSTGRES_USER: ofs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in app/.env}
    ports: ["127.0.0.1:${LOCAL_PG_PORT:-6219}:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofs -d ofs"]
      interval: 3s
      retries: 20
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &env
      DATABASE_URL: postgresql+asyncpg://ofs:${POSTGRES_PASSWORD}@postgres:5432/ofs
      SESSION_SECRET: ${SESSION_SECRET:?set in app/.env}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:9219}
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    build: ./backend
    environment:
      <<: *env
      OFS_CLAUDE_DAILY_LIMIT: ${OFS_CLAUDE_DAILY_LIMIT:-300}
    # The Anthropic key, read at runtime from outside the repo (~/jhc/secrets/anthropic.env locally). Absent: the
    # rules draft intake, labelled as such.
    env_file:
      - path: ${ANTHROPIC_ENV_FILE:-/dev/null}
        required: false
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    build: ./frontend
    ports: ["127.0.0.1:${LOCAL_WEB_PORT:-9219}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/robots.txt"]
      interval: 5s
      retries: 10
volumes:
  pg-data:
