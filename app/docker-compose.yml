# Local and box. Ports bind to loopback only; on the box, the edge Caddy fronts it (POC-11).
name: ofs
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ofs
      POSTGRES_USER: ofs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in app/.env}
    ports: ["127.0.0.1:${LOCAL_PG_PORT:-6219}:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofs -d ofs"]
      interval: 3s
      retries: 20
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &db
      DATABASE_URL: postgresql+asyncpg://ofs:${POSTGRES_PASSWORD}@postgres:5432/ofs
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    build: ./backend
    environment: *db
    ports: ["127.0.0.1:${LOCAL_WEB_PORT:-9219}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  pg-data:
