[project]
name = "ofs"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # assert is how pytest tests

[tool.ruff.lint.per-file-ignores]
"ofs/seed.py" = ["S311", "S608"]  # a seeded PRNG is the point; counts read a fixed list of our own tables
"migrations/versions/*" = ["E501"]  # generated from the models

[tool.mypy]
strict = true
packages = ["ofs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
